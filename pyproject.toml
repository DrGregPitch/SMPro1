[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smpro1"
version = "0.1.0"
description = "Honest evaluation for drug-discovery molecular property prediction: how much random splits inflate, measured."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["drug-discovery", "cheminformatics", "machine-learning", "molecular-property-prediction", "data-leakage"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdkit>=2023.9",
    "matplotlib>=3.7",
    "lightgbm>=4.0",
    # the honest-evaluation model ladder + calibration, reused from the polymer work
    # pinned so a future polytools push cannot break this repo's installs
    "polytools[gbm] @ git+https://github.com/DrGregPitch/polytools@fdb7195682f3ca0d46e5da0b85d8a9a16fe5a1e1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/DrGregPitch/SMPro1"

[tool.hatch.build.targets.wheel]
packages = ["src/smpro1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B905", "C408"]
